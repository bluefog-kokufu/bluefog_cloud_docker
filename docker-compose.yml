version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apache/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./bluefog_cloud_laravel:/var/www/html
      - .php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - DB_HOST=db
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=Pe3$wQecV3we$
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: Pe3$wQecV3we$
      MYSQL_ROOT_PASSWORD: eW3B@eLwcv8we
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: