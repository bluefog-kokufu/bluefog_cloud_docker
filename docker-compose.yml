services:
  web:
    build:
      context: .
      dockerfile: apache/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./bluefog_cloud_laravel:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    environment:
      - DB_HOST=db
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=Te3BiL4cdwer
    depends_on:
      - db

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: 'Te3BiL4cdwer'
      MYSQL_ROOT_PASSWORD: 'X3RsBMNwe39'
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: